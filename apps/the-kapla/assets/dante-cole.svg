<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" width="80" height="110">
  <!-- Head -->
  <rect x="30" y="0" width="20" height="10" fill="#4a3728"/>
  <rect x="20" y="10" width="40" height="10" fill="#8D5524"/>
  <rect x="30" y="10" width="10" height="10" fill="#ffffff"/>
  <rect x="40" y="10" width="10" height="10" fill="#ffffff"/>
  <rect x="30" y="20" width="20" height="10" fill="#8D5524"/>
  <rect x="35" y="25" width="10" height="5" fill="#27ae60"/>
  
  <!-- Neck -->
  <rect x="35" y="30" width="10" height="5" fill="#8D5524"/>
  
  <!-- Shoulders -->
  <rect x="15" y="35" width="15" height="10" fill="#8D5524"/>
  <rect x="50" y="35" width="15" height="10" fill="#8D5524"/>
  
  <!-- Torso -->
  <rect x="25" y="35" width="30" height="15" fill="#8D5524"/>
  
  <!-- Gloves -->
  <rect x="5" y="45" width="10" height="10" fill="#27ae60"/>
  <rect x="65" y="45" width="10" height="10" fill="#27ae60"/>
  
  <!-- Arms -->
  <rect x="15" y="45" width="10" height="10" fill="#8D5524"/>
  <rect x="55" y="45" width="10" height="10" fill="#8D5524"/>
  
  <!-- Shorts -->
  <rect x="20" y="50" width="40" height="10" fill="#2ecc71"/>
  <rect x="25" y="60" width="15" height="10" fill="#2ecc71"/>
  <rect x="40" y="60" width="15" height="10" fill="#2ecc71"/>
  
  <!-- Legs -->
  <rect x="25" y="70" width="15" height="10" fill="#8D5524"/>
  <rect x="40" y="70" width="15" height="10" fill="#8D5524"/>
  
  <!-- Feet -->
  <rect x="20" y="80" width="20" height="10" fill="#8D5524"/>
  <rect x="40" y="80" width="20" height="10" fill="#8D5524"/>
  
  <!-- Shoes -->
  <rect x="20" y="90" width="20" height="10" fill="#4a3728"/>
  <rect x="40" y="90" width="20" height="10" fill="#4a3728"/>
</svg>